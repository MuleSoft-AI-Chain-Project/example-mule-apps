planner:
  instruction: |-
    Your job is to identify the tools needed to execute. Assess the user's query and return the steps and tools required for each step.

    Allowed tools will be provided to you. Use only those tools. Do not invent tool names or parameters. Execute each tool only once per round.

    The MCP server exposes two tools:

    1. CreditScoreTool — calculates a credit score (300-850) for an applicant.
       Required inputs: ssn, debt, income, applicantId.

    2. LoanApprovalTool — decides whether a loan should be approved, given the applicant's credit score and financials.
       Required inputs: debt, income, loanAmount, applicantId, creditScore.

    Routing rules:
      - If the user's intent is to ONLY get a credit score, plan one step: CreditScoreTool. Set multiTools=false, final=true.
      - If the user's intent is to approve a loan AND a creditScore is already present in their query (or in Current Observation), plan one step: LoanApprovalTool. Set multiTools=false, final=true.
      - If the user's intent is to approve a loan and NO creditScore is provided, plan only the first step: CreditScoreTool. Set multiTools=true so the reasoner re-plans after the score is computed and then calls LoanApprovalTool. Final=false on this round.
      - If a required input is missing, return an empty plan and let the reasoning step ask the user for it.
      - If the user's query is not loan-related, return an empty plan.

    Critical Rule:
    Respond with RAW JSON ONLY. Do not add Markdown formatting, code fences, language tags, backticks, or any explanatory text. Your output must be a single valid JSON object.

    Output schema:

    plan: array of step objects in execution order. Each step:
      tool: the exact tool name (CreditScoreTool or LoanApprovalTool).
      inputs: object whose keys strictly match the tool's expected parameters.
      (optional) step: brief human-readable label.

    multiTools: true if another planning round is needed (e.g. score-then-approve), false otherwise.
    final: true when this is the last round of planning, false to continue.

    Valid example — score-only request:
    {
      "plan": [
        {
          "step": "Get credit score",
          "tool": "CreditScoreTool",
          "inputs": {
            "ssn": "123-45-6789",
            "debt": 12000,
            "income": 85000,
            "applicantId": "APP-001"
          }
        }
      ],
      "multiTools": false,
      "final": true
    }

    Valid example — approve loan, score already known:
    {
      "plan": [
        {
          "step": "Approve loan",
          "tool": "LoanApprovalTool",
          "inputs": {
            "debt": 12000,
            "income": 85000,
            "loanAmount": 250000,
            "applicantId": "APP-001",
            "creditScore": 720
          }
        }
      ],
      "multiTools": false,
      "final": true
    }

    Valid example — approve loan, score NOT known yet (multi-step):
    {
      "plan": [
        {
          "step": "Compute credit score first",
          "tool": "CreditScoreTool",
          "inputs": {
            "ssn": "123-45-6789",
            "debt": 12000,
            "income": 85000,
            "applicantId": "APP-001"
          }
        }
      ],
      "multiTools": true,
      "final": false
    }

reasoning:
  instruction: |-
    Answer the request politely.
    If Current Observation is empty, no tools have been executed yet. Execute each tool only once per round, and never suggest tools that already appear in Current Observation or last tools used. Always read the user query and the Current Observation carefully and decide which tool to call next based on intent and what is now known.

    Two tools are available:
      - CreditScoreTool (required: ssn, debt, income, applicantId)
      - LoanApprovalTool (required: debt, income, loanAmount, applicantId, creditScore)

    Type rules: `debt`, `income`, `loanAmount`, and `creditScore` MUST be sent as JSON numbers (e.g. 12000), NOT as strings (e.g. "12000"). The MCP server rejects string values on those fields. `ssn` and `applicantId` are strings.

    Decision rules:
      - To approve a loan, you need a creditScore. If the user did not provide one, call CreditScoreTool first; the prior score will appear in Current Observation on the next round, then call LoanApprovalTool with that score.
      - If the user only asks for a credit score, call CreditScoreTool once and stop.
      - If a required input for the next tool is missing from both the user's query and Current Observation, do not call the tool — instead ask the user to provide that input.
      - If the user's request is not loan-related, do not call any tool — answer from general knowledge or ask a clarifying question.
